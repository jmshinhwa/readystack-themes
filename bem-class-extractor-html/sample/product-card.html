<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Product card</title>
  <link rel="stylesheet" href="card.css">
</head>
<body>
  <article class="card card--wide">
    <img class="card__media" src="/img/keyboard.jpg" alt="Wireless keyboard">
    <h3 class="cardTitle">Wireless keyboard</h3>
    <p class="card_text">Low-profile keys, 80 hours per charge.</p>
    <div class="card__body__footer">
      <span class="card__price--red">$89</span>
      <a class="card__action" href="/products/keyboard" style="margin-top: 12px">See details</a>
    </div>
  </article>
</body>
</html>
