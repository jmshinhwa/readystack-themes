<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Checkout — Northwind Supply</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://www.googletagmanager.com/gtag/js?id=G-7QK2LM4XYZ"></script>
  <script src="https://static.hotjar.com/c/hotjar-3214077.js?sv=6"></script>
  <script src="https://js.paygateway.example/v3/checkout.js" integrity="sha384-K1mS2vOJ5xQ0l9mJj0W8Zt2m0k7X0YbQ3s1c4dF6gH8iJ0kL2mN4oP6qR8sT0uV2"></script>
  <script>window.dataLayer = window.dataLayer || [];</script>
</head>
<body>
  <img src="http://assets.northwind.example/logo.png" alt="Northwind Supply">
  <h1>Payment</h1>
  <form id="pay" action="http://checkout.northwind.example/charge" method="post">
    <input type="text" name="cardnumber" autocomplete="cc-number" placeholder="Card number">
    <input type="text" name="exp" autocomplete="cc-exp" placeholder="MM/YY">
    <input type="text" name="cvv" autocomplete="cc-csc" placeholder="Security code">
    <button type="submit">Pay $129.00</button>
  </form>
  <script>
    var s = document.createElement('script');
    s.src = 'https://widgets.partner.example/upsell.js';
    document.head.appendChild(s);
    document.getElementById('pay').addEventListener('submit', function () {
      sessionStorage.setItem('cardnumber_last4', document.forms.pay.cardnumber.value.slice(-4));
    });
  </script>
</body>
</html>
