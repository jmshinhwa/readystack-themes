apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: storefront
  namespace: retail
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/auth-url: https://sso.retail.internal/oauth2/auth
    nginx.ingress.kubernetes.io/auth-signin: https://sso.retail.internal/oauth2/start
    nginx.ingress.kubernetes.io/whitelist-source-range: 10.40.0.0/16,203.0.113.7/32
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-body-size: 64m
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Store: eu-west";
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: https://shop.example.com
spec:
  rules:
    - host: shop.example.com
      http:
        paths:
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: storefront-api
                port:
                  number: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: storefront-canary
  namespace: retail
  annotations:
    nginx.ingress.kubernetes.io/canary: "true"
    nginx.ingress.kubernetes.io/canary-weight: "10"
    nginx.ingress.kubernetes.io/server-snippet: |
      location /healthz { return 200; }
    nginx.ingress.kubernetes.io/session-cookie-name: storefront
    nginx.ingress.kubernetes.io/load-balance: ewma
    nginx.ingress.kubernetes.io/auth-tls-verify-client: "on"
    nginx.ingress.kubernetes.io/ssl-passthrough: "true"
    nginx.ingress.kubernetes.io/backend-protocol: GRPC
spec:
  ingressClassName: addon-http-application-routing
  rules:
    - host: shop.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: storefront-api-next
                port:
                  number: 8080
