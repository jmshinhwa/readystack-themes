# pyproject.toml as an assistant wrote it in one pass
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Invoice_Toolkit"
version = "1.4.0"
description = "Helpers for parsing and validating supplier invoices"
requires-python = ">=3.8,<4"
license = "Apache 2.0"
license-files = ["/usr/share/licenses/invoice-toolkit/LICENSE", "../COPYING"]
dynamic = ["version"]
authors = [{ name = "A. Maintainer", email = "a@example.com" }]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.6",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3.7",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
]
