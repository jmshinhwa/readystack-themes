name: deploy
on:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt && pytest
  build:
    runs-on: ubuntu-latest
    container: python:3.10-slim
    steps:
      - uses: actions/checkout@v4
      - run: pip wheel . -w dist
  deploy:
    needs: [test, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: aws lambda update-function-configuration --function-name billing-export --runtime python3.10
      - run: gcloud functions deploy invoice-webhook --gen2 --runtime python310 --region europe-west1 --trigger-http
      - run: az functionapp config set --name reports-fn --resource-group ops --linux-fx-version "PYTHON|3.10"
