name: Debug Identity
on: workflow_dispatch

permissions:
  id-token: write
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    environment: marketplace-publish
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Ask Azure DevOps who we are
        run: |
          az rest -u https://app.vssps.visualstudio.com/_apis/profile/profiles/me \
                  --resource 499b84ac-1321-427f-aa17-267ca6975798 > profile.json
          echo "----- PROFILE -----"
          cat profile.json
          echo "----- THE ID WE NEED -----"
          python3 -c "import json;print(json.load(open('profile.json'))['id'])"
