<!-- mein-konto/abo.html — Fitnessstudio-Mitgliedschaft (Muster) -->
<section class="abo">
  <h2>Ihre Mitgliedschaft</h2>
  <p>Mindestlaufzeit 12 Monate, verlängert sich automatisch um einen Monat.</p>
  <a href="/konto/kuendigung" class="link-muted">Abo kündigen</a>
</section>
<form action="/konto/kuendigung" method="post">
  <input type="text" name="kundennummer" placeholder="Kundennummer">
  <input type="password" name="passwort" placeholder="Passwort">
  <select name="kuendigungsgrund" required>
    <option value="">Bitte Grund wählen</option>
    <option>Umzug</option>
  </select>
  <button type="submit">Kündigung absenden</button>
</form>
<section class="bestellungen">
  <h2>Ihre Bestellungen</h2>
  <p>Bestellung 2026-0815 — Laufschuhe, 89,90 €</p>
  <button class="btn" onclick="openRevoke()">Zum Widerruf</button>
</section>
<form action="/konto/widerruf" method="post">
  <input type="text" name="bestellnummer" placeholder="Bestellnummer">
  <input type="email" name="email" placeholder="E-Mail">
  <button type="submit">Widerruf absenden</button>
</form>
