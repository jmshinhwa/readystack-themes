name: ios-release
on:
  push:
    tags: ['v*']
jobs:
  archive-legacy:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -scheme App -sdk iphoneos18.5 -configuration Release archive IPHONEOS_DEPLOYMENT_TARGET=12.0
  testflight:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: bundle exec fastlane beta
  appstore:
    runs-on: macos-15
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'
      - run: bundle exec fastlane release
  widget-build:
    runs-on: macos-15-xlarge
    steps:
      - run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - run: xcodebuild -scheme Widget archive
  matrix-build:
    strategy:
      matrix:
        os: [macos-13, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - run: flutter build ipa --release
  studio-mac:
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - run: xcodebuild -scheme App archive
