name: Marketplace review reply
run-name: reply ${{ inputs.ext }} ${{ inputs.review_id }} ${{ inputs.tag }}
# s197 R2 2026-10-17 — answers one review on OUR extension (publisher readystack) as the publisher, with the same
# Azure login the publish workflow uses. The VPS reply desk (social_reply.py) dispatches it and reads the artifact.
# Gallery REST (azure-devops-node-api GalleryApi.updateReview): PATCH .../reviews/{reviewId} with
# ReviewPatch {operation: 3 = ReplyToReview, reviewItem: {reply: {replyText}}}. Text comes base64 so quoting can't break it.
on:
  workflow_dispatch:
    inputs:
      ext:
        description: extension name (publisher readystack)
        required: true
      review_id:
        description: review id
        required: true
      text_b64:
        description: reply text, base64 (utf-8)
        required: true
      ver:
        description: extension version the reply is about (from package.json)
        required: false
        default: ''
      tag:
        description: run label
        required: false
        default: 'vps'

permissions:
  id-token: write
  contents: read

jobs:
  reply:
    runs-on: ubuntu-latest
    environment: marketplace-publish
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Reply
        env:
          EXT: ${{ inputs.ext }}
          RID: ${{ inputs.review_id }}
          TXT: ${{ inputs.text_b64 }}
          VER: ${{ inputs.ver }}
        run: |
          TOKEN=$(az account get-access-token --resource 499b84ac-1321-427f-aa17-267ca6975798 --query accessToken -o tsv)
          export TOKEN
          python3 - <<'PY'
          import base64, json, os, re, urllib.request, urllib.error
          ext, rid = os.environ['EXT'], os.environ['RID']
          assert re.match(r'^[a-z0-9-]+$', ext) and re.match(r'^\d+$', rid), 'bad input'
          txt = base64.b64decode(os.environ['TXT']).decode('utf-8')
          tok = os.environ['TOKEN']
          url = 'https://marketplace.visualstudio.com/_apis/gallery/publishers/readystack/extensions/%s/reviews/%s' % (ext, rid)
          ver = os.environ.get('VER') or ''
          out = {'ext': ext, 'review': rid, 'tries': []}
          H = {'Authorization': 'Bearer ' + tok, 'Content-Type': 'application/json'}
          def call(method, u, body=None, accept='application/json'):
              req = urllib.request.Request(u, data=(json.dumps(body).encode() if body is not None else None), method=method,
                                           headers=dict(H, Accept=accept))
              try:
                  r = urllib.request.urlopen(req, timeout=30)
                  return r.status, r.read()[:600].decode('utf-8', 'replace'), ''
              except urllib.error.HTTPError as e:
                  return e.code, e.read()[:400].decode('utf-8', 'replace'), urllib.parse.unquote(e.headers.get('X-TFS-ServiceError') or '')[:300]
          import urllib.parse
          st, b, err = call('GET', url + '?api-version=7.2-preview.1')
          out['get'] = {'http': st, 'body': b[:300], 'err': err}
          rep = {'replyText': txt, 'reviewId': int(rid)}
          if ver:
              rep['productVersion'] = ver
          # measured 10/17: the reply PATCH validates the whole review (400 ProductVersion null · then Rating 0) ⇒ send the review as it
          # stands publicly (id · rating · text · title · productVersion · user) with our reply attached
          pub = json.loads(urllib.request.urlopen(urllib.request.Request(
              'https://marketplace.visualstudio.com/_apis/public/gallery/publishers/readystack/extensions/%s/reviews?count=100' % ext,
              headers={'Accept': 'application/json;api-version=3.0-preview.1'}), timeout=30).read())
          base = next((r for r in pub.get('reviews') or [] if str(r.get('id')) == rid), {})
          item = {k: base[k] for k in ('id', 'rating', 'text', 'title', 'productVersion', 'userId', 'userDisplayName', 'updatedDate') if base.get(k) is not None}
          item['id'] = int(rid)
          if not item.get('productVersion') and ver:
              item['productVersion'] = ver
          item['reply'] = rep
          out['base_keys'] = sorted(base.keys())
          variants = [
              ('7.2-preview.1', {'operation': 3, 'reviewItem': item}),
              ('7.2-preview.1', {'operation': 'replyToReview', 'reviewItem': item}),
          ]
          for v, body in variants:
              st, b, err = call('PATCH', url + '?api-version=' + v, body, 'application/json;api-version=' + v)
              out['tries'].append({'ver': v, 'op': body['operation'], 'http': st, 'body': b[:300], 'err': err})
              if st in (200, 201):
                  out['ok'] = True
                  break
          json.dump(out, open('mp_reply.json', 'w'))
          print('ok' if out.get('ok') else 'failed', [(t['http']) for t in out['tries']])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mp-reply
          path: mp_reply.json
          retention-days: 1
