name: Unpublish extension
run-name: Unpublish ${{ inputs.ext }}
# s144 2026-09-12 — take a duplicate extension off the VS Code Marketplace (owner: no duplicate listings).
# Same Azure federated credential as publish.yml. Input = extension name without the publisher (e.g. wcag-clause-audit).
on:
  workflow_dispatch:
    inputs:
      ext:
        description: extension name (publisher readystack)
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  unpublish:
    runs-on: ubuntu-latest
    environment: marketplace-publish
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Unpublish from VS Code Marketplace
        run: npx --yes @vscode/vsce unpublish "readystack.${{ inputs.ext }}" --azure-credential --force
