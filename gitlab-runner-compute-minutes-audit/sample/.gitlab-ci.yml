stages:
  - build
  - test
  - package
  - deploy

default:
  image: node:20

build:
  stage: build
  tags:
    - saas-linux-xlarge-amd64
  timeout: 15m
  interruptible: true
  script:
    - npm ci
    - npm run build

test:
  stage: test
  tags:
    - saas-linux-medium-amd64
  parallel: 8
  timeout: 30m
  interruptible: true
  script:
    - npm test -- --shard=$CI_NODE_INDEX/$CI_NODE_TOTAL

e2e:
  stage: test
  tags: [saas-linux-medium-amd64]
  retry: 2
  timeout: 20m
  interruptible: true
  script:
    - npx playwright test

docker:
  stage: package
  tags:
    - saas-linux-medium-amd64
  timeout: 10m
  script:
    - docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA .

deploy:
  stage: deploy
  tags:
    - deploy-box
  script:
    - ./deploy.sh
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
