name: Publish to MCP Registry
run-name: MCP ${{ inputs.dir }}
# s145 2026-09-13 — ★같은 npm 패키지(@readystack/<slug> · --mcp)를 ★공식 MCP 레지스트리(registry.modelcontextprotocol.io)에 세운다.
#   ★OIDC 라 비밀이 없다 (id-token: write). 이름은 io.github.<이 저장소 주인>/<slug> 이고 npm package.json 의 mcpName 과 같아야 한다.
#   ★VPS(market_publish.push_mcp)가 mcp/<slug>/server.json 을 올리고 이 워크플로를 dir=mcp/<slug> 로 부른다. 먼저 npm 이 그 판을 갖고 있어야 한다.
on:
  workflow_dispatch:
    inputs:
      dir:
        description: folder holding server.json (e.g. mcp/cron-schedule-lint)
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - name: Authenticate to MCP Registry (OIDC)
        run: ./mcp-publisher login github-oidc
      - name: Publish server
        working-directory: ${{ inputs.dir }}
        run: ../../mcp-publisher publish
      - name: Verify
        if: ${{ always() }}
        working-directory: ${{ inputs.dir }}
        run: |
          N=$(python3 -c "import json;print(json.load(open('server.json'))['name'])")
          sleep 5
          curl -s "https://registry.modelcontextprotocol.io/v0.1/servers?search=$N" | head -c 600; echo
